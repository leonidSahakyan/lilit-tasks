# /etc/nginx/sites-available/lilit-tasks
# Lilit's task board at lilit.rebit.ai.

server {
    listen 80;
    listen [::]:80;
    server_name lilit.rebit.ai;
    include letsencrypt;
    location / { return 301 https://lilit.rebit.ai$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lilit.rebit.ai;

    ssl_certificate     /etc/letsencrypt/live/lilit.rebit.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lilit.rebit.ai/privkey.pem;

    root /var/www/lilit-tasks;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
